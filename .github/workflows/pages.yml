name: Publish synthetic query demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published demo assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const base = new URL(process.env.PAGE_URL);
          const manifest = JSON.parse(await readFile('public-assets.json', 'utf8'));
          for (const name of manifest.filter(name => !name.startsWith('.'))) {
            const response = await fetch(new URL(name, base), { signal: AbortSignal.timeout(30000) });
            assert.equal(response.status, 200, `${name}: HTTP ${response.status}`);
            assert.deepEqual(Buffer.from(await response.arrayBuffer()), await readFile(name),
              `${name}: deployed content differs`);
          }
          console.log(`Verified public demo assets at ${base}`);
          NODE
